# Daily scout run: start the VM, SSH in and run one scout cycle, then
# deallocate the VM so it isn't billed for the ~23h/day it does nothing.
# Runs whatever code the last Deploy rsynced onto the VM.
name: Scheduled run

on:
  schedule:
    # 19:00 UTC (prior day) = 05:00 Melbourne time (AEST, UTC+10; no DST in winter).
    # One fire a day, deliberately. A second 01:00 UTC slot used to run here,
    # but by then the morning run had already claimed the day's new listings,
    # so the tracker saw them as unchanged and the afternoon brief was almost
    # always "no strong matches today" — a duplicate Discord ping for a full
    # extra VM boot and LLM cycle. Note GitHub cron drift is real and large
    # (this slot lands ~1h late; the retired 01:00 slot ran 3–4h late), so
    # don't read the nominal time as a delivery guarantee.
    - cron: "0 19 * * *"
  workflow_dispatch:

# Needed for azure/login's OIDC federated-credential flow (no stored cloud secret).
permissions:
  id-token: write
  contents: read

jobs:
  run-job:
    runs-on: ubuntu-latest
    # Serializes against Deploy, which drives the same single VM — see the long
    # note on deploy.yml's `deploy` job for the failure this prevents. The group
    # name is a lock on the VM, so it MUST match deploy.yml's verbatim.
    concurrency:
      group: scout-vm
      cancel-in-progress: false
    env:
      APP_DIR: /opt/job-market-scout
      VM_USER: ${{ vars.VM_USER }}
      VM_HOST: ${{ vars.VM_HOST }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      # Fixed by infra/main.bicepparam (param vmName = 'scout-vm').
      VM_NAME: scout-vm
      # Fixed by infra/main.bicepparam (param dashboardStorageAccountName).
      DASHBOARD_STORAGE_ACCOUNT: trung6405scoutdash
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM
        run: |
          set -euo pipefail
          # az vm start is idempotent: no-op if already running.
          az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

      - name: Set up SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Wait for SSH
        run: |
          set -euo pipefail
          # az vm start returns once the VM is allocated, but sshd may need a
          # few more seconds after boot. Retry for up to ~2 minutes.
          for i in $(seq 1 24); do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=5 "$VM_USER@$VM_HOST" 'true' 2>/dev/null; then
              echo "SSH is up."
              exit 0
            fi
            echo "SSH not ready yet (attempt $i)..."
            sleep 5
          done
          echo "VM did not become reachable over SSH in time." >&2
          exit 1

      - name: Run scout cycle
        run: |
          set -euo pipefail
          # `docker compose run` starts the app's healthy-gated dependencies
          # (postgres, jobspy-mcp); the long-lived services also come back on
          # their own via restart: unless-stopped after the boot.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "cd $APP_DIR && docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm app"

      - name: Pull dashboard content from VM
        run: |
          set -euo pipefail
          mkdir -p dashboard-staging
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "$VM_USER@$VM_HOST:$APP_DIR/reports/" dashboard-staging/
          # Storage static websites support only one global index-document
          # name for the whole account (unlike nginx's per-location `index`
          # directive) — standardize on index.html per folder. history.html
          # is kept too, since it's still linked to directly by name.
          cp dashboard-staging/history.html dashboard-staging/index.html

      - name: Deploy dashboard to Storage static website
        run: |
          set -euo pipefail
          # --auth-mode login reuses the OIDC session from "Azure login"
          # above — no separate deploy-token secret needed. --overwrite so
          # stale files from a previous run's report folders don't linger
          # once superseded (history.html/profile.html always regenerate).
          az storage blob upload-batch \
            --account-name "$DASHBOARD_STORAGE_ACCOUNT" --auth-mode login \
            --destination '$web' --source dashboard-staging --overwrite

      # The weekly gate is decided here, in its own step, so the aggregator step
      # can be genuinely `skipped` rather than succeeding-without-doing-anything.
      # It used to `exit 0` inside the script on the wrong weekday, which made
      # "skipped", "ran fine" and "failed" all report the same green tick — and
      # that is how a run that did nothing for three days went unnoticed.
      - name: Decide whether the weekly aggregation is due
        id: aggregation_due
        run: |
          set -euo pipefail
          # Sunday *UTC* (date -u +%u = 7): the 19:00 UTC fire lands at 05:00
          # Melbourne the following morning, so Sunday UTC is Monday local,
          # which is the intended cadence. Manual workflow_dispatch runs always
          # qualify, for testing.
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Weekly aggregation is due."
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Not Sunday UTC (= Monday Melbourne) — aggregator will be skipped."
          fi

      - name: Run coach aggregator (weekly)
        # success() is explicit because naming an `if:` at all drops the
        # implicit success() guard — without it this would run even when the
        # scout cycle above had already failed.
        if: success() && steps.aggregation_due.outputs.due == 'true'
        # A first run against an empty corpus is legitimately long: the gather
        # phase alone throttles GitHub Search at 2.5s per distinct gap skill,
        # and the ingest loop then makes one LLM tagging call per candidate,
        # serially. So this bound is generous rather than tight — its job is to
        # stop an indefinite block, not to police a slow run. Tighten it once
        # the phase timings in the logs show what a healthy run actually costs.
        #
        # Deliberately NOT continue-on-error. It was, which meant a failure
        # reported green; the two things that protection existed for are both
        # safe without it — the dashboard deploy already ran above, and the
        # deallocate step below is `if: always()`.
        timeout-minutes: 120
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "cd $APP_DIR && docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm app python -m scout.coach_aggregator"

      - name: Run coach link-health check (daily)
        # Unlike the aggregator above, this runs on every daily fire, not one
        # weekday — the batch cap bounds each run's cost, and daily cycling is
        # what lets the check happen *between* weekly aggregations (NFR-CC-4).
        #
        # Bounded for the same reason as the aggregator: it makes outbound HTTP
        # calls, so it can block indefinitely too. The cap makes this one tight,
        # so the bound can be as well. Runs even when the aggregator failed —
        # verifying existing links does not depend on new ones being added —
        # but not when the run was cancelled, since that would SSH into a VM
        # already being torn down. `!cancelled()` is the difference from
        # `always()`.
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "cd $APP_DIR && docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm app python -m scout.coach_link_health"

      - name: Deallocate VM
        # always(): stop billing even if the run, dashboard pull/deploy, or
        # SSH never came up. Deallocate (not stop) releases the compute so
        # it isn't charged.
        if: always()
        run: |
          set -euo pipefail
          az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"
