# Manual: provision/update the Azure VM (infra/main.bicep) and the dashboard
# storage account (infra/dashboard.bicep). Kept as separate deployments so a
# dashboard-only change never depends on the VM template.
# Authenticates to Azure via OIDC federated credentials (no stored cloud secret).
name: Provision infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create --name "$RESOURCE_GROUP" --location "$AZURE_LOCATION"

      - name: Deploy VM Bicep (main.bicep)
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query "properties.outputs" -o json

      - name: Deploy dashboard storage Bicep (dashboard.bicep)
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/dashboard.bicep \
            --parameters infra/dashboard.bicepparam \
            --query "properties.outputs" -o json

      - name: Enable static website hosting on the dashboard storage account
        run: |
          set -euo pipefail
          # Static website hosting ($web container, index/error docs) is a
          # data-plane setting with no ARM resource property, so it's set
          # here instead of in dashboard.bicep. Idempotent: re-running this
          # is a no-op if already enabled.
          ACCOUNT_NAME=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" --name dashboard \
            --query "properties.outputs.dashboardStorageAccountNameOut.value" -o tsv)
          az storage blob service-properties update \
            --account-name "$ACCOUNT_NAME" --auth-mode login \
            --static-website --index-document index.html

      - name: Deploy managed Postgres Bicep (postgres.bicep)
        env:
          # postgres.bicepparam reads both of these via readEnvironmentVariable()
          # at compile time. Neither has a default, so a missing secret fails the
          # deployment rather than provisioning a server with an empty password
          # or a firewall rule open to everything.
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          set -euo pipefail
          # Separate deployment from main.bicep for the same reason dashboard is
          # (see the comment atop dashboard.bicep). Deployment name defaults to
          # the template's base name, matching how `dashboard` is looked up above.
          #
          # NOTE: this creates a billable resource — $24.57/month measured, no
          # free allowance on this subscription (spec Amendment A1). It is
          # dispatched by hand, never on push.
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/postgres.bicep \
            --parameters infra/postgres.bicepparam \
            --query "properties.outputs" -o json
