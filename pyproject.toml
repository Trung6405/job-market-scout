# Lint and type-check configuration only. This repo is deployed by rsync, not
# packaged, so there is deliberately no [project] section.

[tool.ruff]
# CI and the container run 3.12 (the local venv may be newer); lint against
# what production executes.
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", # imports
    "E7", # statements
    "E9", # syntax errors
    "F", # pyflakes
    "I", # import sorting
    "UP", # pyupgrade
    "B", # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# Tests import mid-file on purpose (fixtures/stubs must exist before the
# module under test loads) and assert on deliberately generic stub exceptions.
"tests/*" = ["E402", "B017"]

[tool.mypy]
python_version = "3.12"
files = ["scout"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Third-party deps without stubs (litellm, sentence_transformers, jinja2's
# markdown pipeline, ...) — don't let their missing types fail our gate.
ignore_missing_imports = true
